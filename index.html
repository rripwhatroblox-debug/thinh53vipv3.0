data:text/html,<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Geometry Dash VN - Cát Vàng & Bay Nhanh Hết Xăng</title><style>body{font-family:sans-serif;background:#111;color:#fff;text-align:center;margin:0;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;touch-action:none;user-select:none}#info{font-size:16px;margin-bottom:6px}canvas{background:#1e1e2f;border:3px solid #444;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.5);touch-action:none}.fuel-container{width:200px;height:12px;background:#333;border:1px solid #666;border-radius:6px;margin-top:6px;overflow:hidden}.fuel-bar{width:100%;height:100%;background:#f1c40f;transition:width 0.05s linear}.btn-jump{width:80px;height:80px;font-size:36px;background:#c0392b;color:#fff;border:3px solid #e74c3c;border-radius:50%;margin-top:12px;cursor:pointer;outline:none;box-shadow:0 4px 8px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;touch-action:none}.btn-jump:active{background:#e74c3c;transform:scale(0.95)}#msg{font-size:20px;font-weight:bold;margin-top:8px;min-height:28px}.pop{animation:pop 0.6s ease-out}@keyframes pop{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}.restart-btn{margin-top:8px;padding:8px 16px;font-size:16px;background:#27ae60;color:#fff;border:none;border-radius:5px;cursor:pointer}</style></head><body><h2>🇻🇳 Geometry Dash VN</h2><div id="info">Màn: <span id="lvl">1</span>/30 | Tiến độ: <span id="prog">0</span>%</div><canvas id="game" width="360" height="200"></canvas><div class="fuel-container"><div id="fuelBar" class="fuel-bar"></div></div><div id="msg"></div><div class="btn-jump" id="btnUp">⬆️</div><script>const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),btn=document.getElementById('btnUp'),fuelBar=document.getElementById('fuelBar'),msgEl=document.getElementById('msg');let level=1,progress=0,isOver=!1,isWin=!1,pressing=!1,gameLoop,speed=3,maxFuel=110,fuel=110,player={x:50,y:140,w:24,h:24,vy:0,gravity:0.45,flyPower:-4.8,groundY:140},obstacles=[],pads=[],levelLength=2000,dist=0;function startLevel(){dist=0;progress=0;isOver=!1;isWin=!1;fuel=maxFuel;player.y=player.groundY;player.vy=0;speed=3.2+(level-1)*0.22;generateMap();updateUI();clearInterval(gameLoop);gameLoop=setInterval(update,1000/60)}function generateMap(){obstacles=[];pads=[];let x=300;const minGap=Math.max(70,120-(level*1.5));while(x<levelLength){let rand=Math.random();if(rand>0.3){obstacles.push({x:x,w:20,h:22})}else if(rand<0.15){pads.push({x:x,w:30,h:8,used:!1})}x+=minGap+Math.random()*110}}function updateUI(){document.getElementById('lvl').innerText=level;document.getElementById('prog').innerText=Math.min(100,Math.floor((dist/levelLength)*100));fuelBar.style.width=(fuel/maxFuel*100)+'%'}function showLevelWinMsg(){msgEl.innerHTML='<span class="pop" style="color:#f1c40f;display:inline-block">🎉 Chúc mừng bạn qua màn '+level+'! 🎉</span>';setTimeout(()=>{if(!isOver&&!isWin)msgEl.innerText=''},1200)}function setPress(val){pressing=val}document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key===' ')setPress(!0)});document.addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key===' ')setPress(!1)});btn.addEventListener('touchstart',e=>{e.preventDefault();setPress(!0)});btn.addEventListener('touchend',e=>{e.preventDefault();setPress(!1)});btn.addEventListener('mousedown',e=>{setPress(!0)});btn.addEventListener('mouseup',e=>{setPress(!1)});function resetGame(){level=1;msgEl.innerText='';startLevel()}function update(){if(isOver||isWin)return;if(pressing&&fuel>0){player.vy=player.flyPower;fuel-=1}else{player.vy+=player.gravity}player.y+=player.vy;if(player.y>=player.groundY){player.y=player.groundY;player.vy=0;if(!pressing&&fuel<maxFuel){fuel=Math.min(maxFuel,fuel+0.28)}}if(player.y<0){player.y=0;player.vy=0}dist+=speed;updateUI();pads.forEach(p=>{if(p.x+p.w>0)p.x-=speed;if(!p.used&&player.x<p.x+p.w&&player.x+player.w>p.x&&player.y+player.h>=player.groundY){player.vy=-10.5;p.used=!0}});if(dist>=levelLength){if(level>=30){isWin=!0;clearInterval(gameLoop);msgEl.innerHTML='<span style="color:#2ecc71">Chúc mừng bạn 🎉</span><br><button class="restart-btn" onclick="resetGame()">Chơi lại</button>';return}else{showLevelWinMsg();level++;startLevel();return}}obstacles.forEach(o=>{if(o.x+o.w>0){o.x-=speed}if(player.x<o.x+o.w&&player.x+player.w>o.x&&player.y+player.h>player.groundY-o.h+24){isOver=!0;clearInterval(gameLoop);msgEl.innerHTML='<span style="color:#e74c3c">Chúc may mắn lần sau 😢</span><br><button class="restart-btn" onclick="resetGame()">Chơi lại</button>'}});draw()}function draw(){ctx.fillStyle='#1e1e2f';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#333';ctx.fillRect(0,164,canvas.width,36);ctx.fillStyle='#e74c3c';ctx.fillRect(0,164,canvas.width,3);pads.forEach(p=>{if(p.x<canvas.width&&p.x+p.w>0){ctx.fillStyle='#f39c12';ctx.fillRect(p.x,160,p.w,4);ctx.fillStyle='#f1c40f';ctx.fillRect(p.x+2,162,p.w-4,2)}});ctx.font='20px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('🇻🇳',player.x,player.y);obstacles.forEach(o=>{if(o.x<canvas.width&&o.x+o.w>0){ctx.fillStyle='#ff9f43';ctx.beginPath();ctx.moveTo(o.x,player.groundY+24);ctx.lineTo(o.x+o.w/2,player.groundY+24-o.h);ctx.lineTo(o.x+o.w,player.groundY+24);ctx.closePath();ctx.fill()}})}startLevel();</script></body></html>
